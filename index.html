<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- build: general-public 40Q scene+tiebreak, 2026-11-22 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MBTI 성격유형 검사 · 40문항</title>
<meta name="description" content="일상 속 장면을 읽고 더 자연스러운 쪽을 고르는 40문항 MBTI 성격유형 검사. 네 축의 비율과 일할 때와 평소의 차이, 인지기능 성향, 16유형 해설을 한 번에 확인하고 결과를 복사할 수 있습니다.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mujusang.github.io/mbti-test/">
<meta property="og:title" content="MBTI 성격유형 검사 · 40문항">
<meta property="og:description" content="장면 속에서 고르는 40문항, 축별 비율과 일할 때와 평소의 차이, 인지기능 성향, 16유형 해설까지. 결과는 한 번에 복사할 수 있습니다.">
<meta property="og:locale" content="ko_KR">
<meta property="og:image" content="https://mujusang.github.io/mbti-test/assets/hero.jpg">
<meta name="theme-color" content="#f4f2ec">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233d5a80'/%3E%3Crect x='14' y='14' width='16' height='16' rx='4' fill='%23f4f2ec'/%3E%3Crect x='34' y='14' width='16' height='16' rx='4' fill='%23c9b183'/%3E%3Crect x='14' y='34' width='16' height='16' rx='4' fill='%23c9b183'/%3E%3Crect x='34' y='34' width='16' height='16' rx='4' fill='%23f4f2ec'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4f2ec;
    --card:#fffdf8;
    --ink:#21262e;
    --body:#3b4048;
    --muted:#7c7669;
    --line:#e6e0d4;
    --a:#3d5a80;
    --aSoft:#dfe8f3;
    --b:#a9825a;
    --bSoft:#f3ebdf;
    --ok:#3f7a5c;
    --sans:"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic","Helvetica Neue",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-text-size-adjust:100%;}
  html{background:var(--bg);}
  body{
    margin:0;
    font-family:var(--sans);
    color:var(--body);
    background-color:var(--bg);
    background-image:
      radial-gradient(120% 55% at 50% 0%, #fbf9f3 0%, rgba(251,249,243,0) 62%),
      radial-gradient(90% 45% at 50% 100%, #f7f3e9 0%, rgba(247,243,233,0) 70%);
    -webkit-font-smoothing:antialiased;
    line-height:1.62;
    min-height:100dvh;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 16px calc(44px + env(safe-area-inset-bottom));}

  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(244,242,236,.94);
    backdrop-filter:saturate(150%) blur(8px);
    -webkit-backdrop-filter:saturate(150%) blur(8px);
    border-bottom:1px solid var(--line);
    padding:10px 0 9px;
    margin:0 -16px 18px;
    padding-left:16px;padding-right:16px;
    display:none;
  }
  .topbar.on{display:block;}
  .tbRow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px;}
  .tbTitle{font-size:12.5px;letter-spacing:.10em;color:var(--muted);font-weight:600;}
  .tbCount{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .tbTrack{height:5px;border-radius:4px;background:#e7e1d4;overflow:hidden;}
  .tbTrack i{display:block;height:100%;width:0;background:var(--a);border-radius:4px;transition:width .28s ease;}

  /* intro */
  .hero{padding:26px 4px 6px;}
  .eyebrow{font-size:11.5px;letter-spacing:.12em;color:var(--b);font-weight:700;text-indent:.12em;}
  h1{font-size:clamp(23px, 6.4vw, 29px);line-height:1.34;margin:10px 0 8px;color:var(--ink);letter-spacing:-.02em;font-weight:700;word-break:keep-all;}
  .lead{font-size:16px;color:var(--body);margin:0 0 20px;}
  .lead b{color:var(--ink);font-weight:700;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:18px 18px;margin:0 0 14px;
    box-shadow:0 1px 0 rgba(60,50,30,.03), 0 8px 22px -18px rgba(50,40,20,.35);
  }
  .card h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:700;letter-spacing:.02em;}
  .card p{margin:0 0 10px;font-size:14.6px;word-break:keep-all;}
  .card p:last-child{margin-bottom:0;}
  .lead{word-break:keep-all;}
  .facts{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 0;}
  .fact{font-size:12.8px;color:var(--a);background:var(--aSoft);border-radius:999px;padding:5px 11px;font-weight:600;}
  .hint{font-size:13.4px;color:var(--muted);margin:14px 2px 0;word-break:keep-all;}
  .hint b{color:var(--b);}
  .miniLinks{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:9px;margin:12px 0 0;font-size:13px;color:var(--muted);}
  .miniLinks button,.miniLinks a{font:inherit;color:var(--muted);background:none;border:0;padding:1px 0;text-decoration:none;border-bottom:1px solid #d9d2c3;cursor:pointer;line-height:1.5;}
  .miniLinks button:active,.miniLinks a:active{color:var(--a);border-bottom-color:var(--a);}
  .miniLinks .dot{color:#cfc8b8;}

  .btnRow{display:flex;flex-direction:column;gap:9px;margin-top:20px;}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;border:1px solid transparent;border-radius:15px;
    padding:16px 18px;font-size:16.5px;font-weight:700;font-family:inherit;
    background:var(--a);color:#fff;cursor:pointer;
    transition:transform .12s ease, background .15s ease, box-shadow .15s ease;
    box-shadow:0 8px 20px -14px rgba(40,60,90,.9);
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:translateY(1px);}
  .btn.ghost{background:transparent;color:var(--a);border-color:#cfd8e4;box-shadow:none;font-weight:600;}
  .btn.small{font-size:14.5px;padding:13px 16px;border-radius:13px;}
  .btn[disabled]{background:#d7dbe1;border-color:#d7dbe1;color:#fff;cursor:default;box-shadow:none;}
  .btn.ghost[disabled]{background:transparent;border-color:#ece7dc;color:#bdb6a8;}

  /* question */
  .qWrap{padding-top:2px;}
  .qTagRow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .qTag{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--b);background:var(--bSoft);border-radius:999px;padding:5px 11px;}
  .qTag.work{color:#2f4f6d;background:var(--aSoft);}
  .qTag.fn{color:#5c6b52;background:#e9efe2;}
  .qTag.tie{color:#8a3f2a;background:#f7e6df;}
  .qNum{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}

  .scene{
    font-size:15px;line-height:1.66;color:#6f6a5e;
    margin:0 0 14px;padding:2px 0 2px 12px;
    border-left:3px solid #e3dac6;border-radius:2px;
    word-break:keep-all;
  }
  .ask{
    font-size:21px;line-height:1.45;color:var(--ink);font-weight:700;
    margin:0 0 15px;letter-spacing:-.01em;word-break:keep-all;
  }
  .poles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px;}
  .pole{
    display:flex;align-items:center;justify-content:center;text-align:center;
    min-height:86px;padding:12px 11px;border-radius:14px;border:1px solid var(--line);
    background:var(--card);font-family:inherit;font-size:14.8px;line-height:1.48;
    color:var(--body);font-weight:600;cursor:pointer;word-break:keep-all;
    -webkit-tap-highlight-color:transparent;
    transition:background .13s ease,border-color .13s ease,color .13s ease,transform .12s ease;
  }
  .pole.L{border-color:#dbe4ef;background:#f3f7fc;}
  .pole.R{border-color:#ece0cd;background:#fbf4e9;}
  .pole:active{transform:translateY(1px);}
  .pole[aria-pressed="true"]{background:var(--a);border-color:var(--a);color:#fff;}

  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .scale button{
    height:50px;border-radius:13px;border:1px solid var(--line);background:var(--card);
    font-family:inherit;font-size:15.5px;font-weight:800;color:#8c8577;cursor:pointer;
    font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;
    transition:background .13s ease,border-color .13s ease,color .13s ease;
  }
  .scale button:hover{border-color:#cfd8e4;}
  .scale button[aria-pressed="true"]{background:var(--a);border-color:var(--a);color:#fff;}
  .scaleCap{font-size:11.8px;color:var(--muted);margin-top:8px;text-align:center;word-break:keep-all;}

  .qNav{display:flex;align-items:center;gap:9px;margin-top:18px;}
  .qNav .btn{flex:1 1 0;margin:0;}
  .kb{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;display:none;}
  @media (hover:hover) and (pointer:fine){ .kb{display:block;} }

  /* tie-break stage */
  .tieList{display:grid;gap:7px;margin:12px 0 0;}
  .tieItem{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:#fbf7ef;border:1px solid #efe6d6;border-radius:12px;padding:10px 13px;
    font-size:13.4px;color:var(--ink);font-weight:600;
  }
  .tieItem span{font-size:12.4px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;}
  .tieOpts{display:grid;gap:10px;}
  .tieOpt{
    display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px 16px;font-family:inherit;font-size:16.2px;line-height:1.5;color:var(--body);font-weight:600;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:background .13s ease, border-color .13s ease, color .13s ease;
    word-break:keep-all;
  }
  .tieOpt .tieL{
    flex:0 0 auto;min-width:44px;height:30px;border-radius:9px;padding:0 7px;
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:800;color:var(--a);background:var(--aSoft);border:1px solid #cfdcec;
  }
  .tieOpt:hover{border-color:#cfd8e4;background:#fff;}
  .tieOpt[aria-pressed="true"]{background:var(--a);border-color:var(--a);color:#fff;}
  .tieOpt[aria-pressed="true"] .tieL{background:rgba(255,255,255,.20);border-color:rgba(255,255,255,.32);color:#fff;}

  /* result */
  .resTop{padding:16px 2px 4px;text-align:center;}
  .resKicker{font-size:11.5px;letter-spacing:.26em;color:var(--b);font-weight:700;text-indent:.26em;}
  .typeCode{
    font-size:52px;font-weight:800;letter-spacing:.06em;color:var(--ink);
    margin:6px 0 0;line-height:1.05;font-variant-numeric:tabular-nums;
  }
  .typeName{font-size:17px;color:var(--a);font-weight:700;margin:8px 0 0;}
  .typeLine{font-size:14.6px;color:var(--muted);margin:8px 14px 0;word-break:keep-all;}

  .sec{margin-top:22px;}
  .secT{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 10px;}
  .secT h3{font-size:15px;margin:0;color:var(--ink);font-weight:700;letter-spacing:-.01em;}
  .secT span{font-size:12px;color:var(--muted);}

  .g{padding:13px 0 14px;border-bottom:1px solid var(--line);}
  .g:last-child{border-bottom:0;padding-bottom:2px;}
  .gHead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:2px;}
  .gHead .side{font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--muted);}
  .gHead .side b{color:var(--ink);font-weight:800;font-size:15px;}
  .gHead .nm{font-size:12.5px;color:var(--muted);letter-spacing:.02em;}
  .track{position:relative;height:9px;border-radius:6px;background:var(--bSoft);margin:8px 0 7px;}
  .track .fillA{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--aSoft);}
  .track .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:#5c5548;border-radius:2px;transform:translateX(-1px);}
  .gNote{font-size:12.5px;color:var(--muted);}
  .gNote b{color:var(--b);font-weight:700;}
  .gNote .edge{color:#9b5c3f;font-weight:700;}
  .gSub{font-size:11.8px;color:#8f8878;margin-top:3px;font-variant-numeric:tabular-nums;}
  .legend{font-size:11.8px;color:var(--muted);margin:2px 2px 0;}

  .wdRow{display:grid;grid-template-columns:64px 1fr;gap:6px 10px;align-items:center;padding:9px 0;border-bottom:1px dashed #ece6da;}
  .wdRow:last-child{border-bottom:0;}
  .wdLab{font-size:12.5px;color:var(--muted);font-weight:600;}
  .wdNums{font-size:13.8px;font-variant-numeric:tabular-nums;color:var(--muted);}
  .wdNums b{color:var(--ink);font-weight:800;}
  .mini{grid-column:2;display:flex;height:6px;border-radius:4px;overflow:hidden;background:#efe9dd;}
  .mini i{display:block;height:100%;}
  .mini i.a{background:var(--aSoft);}
  .mini i.b{background:#e3cbb0;}
  .wdAxis{font-size:13px;font-weight:700;color:var(--ink);padding-top:14px;}
  .wdNote{font-size:12px;color:var(--muted);padding:6px 0 2px;border-top:1px dashed #ece6da;margin-top:6px;}
  .wdNote b{color:var(--b);font-weight:700;}

  .fnRow{padding:8px 0;}
  .fnTop{display:flex;align-items:baseline;gap:7px;margin-bottom:2px;}
  .fnCode{font-size:12.6px;color:var(--a);background:var(--aSoft);border-radius:6px;padding:1px 6px;font-weight:800;}
  .fnName{font-size:13.2px;color:var(--body);}
  .fnVal{margin-left:auto;font-size:12.6px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .fnDesc{font-size:11.8px;color:#8f8878;margin:0 0 5px;}
  .fnBar{height:7px;border-radius:5px;background:#efe9dd;overflow:hidden;}
  .fnBar i{display:block;height:100%;border-radius:5px;background:#c3cddb;width:0;}
  .fnRow.top .fnCode{background:var(--a);color:#fff;}
  .fnRow.top .fnBar i{background:var(--a);}
  .fnRow.top .fnVal{color:var(--ink);font-weight:700;}

  .c2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;}
  .c2Lab{font-size:11.8px;letter-spacing:.1em;color:var(--b);font-weight:700;margin-bottom:6px;}
  .c2Main{font-size:15.4px;color:var(--ink);font-weight:700;line-height:1.5;}
  .c2Main em{font-style:normal;color:var(--a);}
  .c2Note{font-size:13.2px;color:var(--muted);margin-top:8px;word-break:keep-all;}
  .c2Note + .c2Note{margin-top:6px;}
  .insightP + .insightP{margin-top:9px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px;}
  .chip2{font-size:12.4px;color:#8a5b3d;background:#f6ede1;border-radius:999px;padding:5px 10px;font-weight:600;font-variant-numeric:tabular-nums;}
  .chip3{font-size:12.4px;color:var(--muted);background:#f1ece1;border-radius:999px;padding:5px 10px;font-variant-numeric:tabular-nums;}

  .cmpCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;}
  .cmpRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14.4px;color:var(--muted);}
  .cmpRow + .cmpRow{margin-top:6px;}
  .cmpRow .k{font-size:11.8px;color:var(--muted);min-width:72px;letter-spacing:.02em;}
  .cmpRow .v{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:.03em;font-variant-numeric:tabular-nums;}
  .cmpRow .v.core{color:#9b5c3f;}
  .cmpArrow{font-size:13px;color:var(--b);font-weight:700;}

  .badgeRow{display:flex;flex-wrap:wrap;gap:7px;}
  .badge{font-size:12.2px;font-weight:700;border-radius:999px;padding:5px 11px;}
  .badge.flip{color:#8a3f2a;background:#f7e6df;}
  .badge.keep{color:#3f6a52;background:#e4efe6;}
  .badge.settle{color:#2f4f6d;background:var(--aSoft);}
  .badge.none{color:var(--muted);background:#f1ece1;}

  .tieList2{display:grid;gap:10px;}
  .tieCard{padding:12px 0;border-bottom:1px dashed #ece6da;}
  .tieCard:last-child{border-bottom:0;padding-bottom:2px;}
  .tieCard .axisLab{font-size:11.8px;color:var(--b);font-weight:700;letter-spacing:.04em;}
  .tieCard .axisQ{font-size:13.8px;color:var(--ink);font-weight:700;margin:3px 0 4px;word-break:keep-all;}
  .tieCard .axisA{font-size:13.2px;color:var(--body);word-break:keep-all;}
  .tieCard .axisR{font-size:12.2px;margin-top:5px;font-weight:700;}
  .tieCard .axisR.flip{color:#9b5c3f;}
  .tieCard .axisR.keep{color:#3f7a5c;}
  .tieCard .axisR.settle{color:#2f4f6d;}

  .report{
    width:100%;margin:10px 0 0;padding:14px;border-radius:14px;border:1px solid var(--line);
    background:#fbf8f1;color:var(--body);font-family:ui-monospace,Menlo,Consolas,"Apple SD Gothic Neo",monospace;
    font-size:12.2px;line-height:1.66;white-space:pre-wrap;word-break:break-word;
    max-height:340px;overflow:auto;display:none;
  }
  .report.on{display:block;}
  textarea.report{resize:vertical;}

  .foot{font-size:11.8px;color:#9a9384;text-align:center;margin-top:26px;line-height:1.6;word-break:keep-all;}

  .toast{
    position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
    background:#2b323c;color:#fff;font-size:13.6px;padding:10px 16px;border-radius:12px;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:60;max-width:86vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translate(-50%,0);}

  /* intro v2 — 대표 이미지 · 지표 · 16유형 · 팁 */
  .heroArt{
    margin:12px 0 20px;border-radius:20px;overflow:hidden;
    border:1px solid var(--line);background:#efe9dd;
    box-shadow:0 24px 44px -36px rgba(50,40,20,.75);
  }
  .heroArt img{display:block;width:100%;height:clamp(206px,52vw,300px);object-fit:cover;object-position:50% 46%;}
  .hero .btnRow{margin-top:18px;}

  .secHead{margin:28px 2px 11px;}
  .secHead .kicker{display:block;font-size:10.8px;letter-spacing:.24em;color:var(--b);font-weight:800;text-indent:.24em;margin-bottom:5px;}
  .secHead h2{font-size:16.6px;margin:0 0 5px;color:var(--ink);font-weight:700;letter-spacing:-.015em;line-height:1.4;word-break:keep-all;}
  .secHead p{margin:0;font-size:13.1px;color:var(--muted);line-height:1.6;word-break:keep-all;}

  .axWrap{display:grid;gap:9px;}
  .axCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px 12px;box-shadow:0 1px 0 rgba(60,50,30,.03);}
  .axHd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:9px;}
  .axHd b{font-size:13.6px;color:var(--ink);font-weight:700;letter-spacing:-.01em;}
  .axHd span{font-size:10.6px;color:#a49c8c;letter-spacing:.02em;text-align:right;}
  .axTwo{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .axSide{border:1px solid #dfe8f2;background:#f4f8fc;border-radius:12px;padding:9px 10px 10px;}
  .axSide.r{border-color:#eee2ce;background:#fcf6ec;}
  .axTop{display:flex;align-items:baseline;gap:6px;}
  .axTop i{font-style:normal;font-size:15.5px;font-weight:800;color:var(--a);line-height:1;font-variant-numeric:tabular-nums;}
  .axSide.r .axTop i{color:var(--b);}
  .axTop b{font-size:12.8px;color:var(--ink);font-weight:700;}
  .axEn{display:block;font-size:10.4px;color:#9c9484;letter-spacing:.01em;margin-top:3px;}
  .axSide p{margin:5px 0 0;font-size:12.05px;line-height:1.5;color:var(--body);word-break:keep-all;}
  .axDiff{margin-top:9px;padding-top:8px;border-top:1px dashed #ece5d6;font-size:11.9px;color:#8a7f6c;text-align:center;word-break:keep-all;}
  .axDiff b{color:var(--b);font-weight:700;}

  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 11px;}
  .tabBtn{
    display:flex;flex-direction:column;align-items:center;gap:1px;

const BORDER_LIMIT = 10;   // 축 점수가 50에서 이 값 이내면 비슷하게 나온 축으로 보고 확인 문답을 띄운다
const TIE_WEIGHT = 6;      // 결정 문답 1문항의 무게(보통 문항 3개분, 최대 기여 16점 기준)

function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function signed(v) { return 3 - v; }

function pctFromSum(sum, n) {
  const max = Math.max(1, n * 2);
  return clamp(Math.round(50 + (sum / max) * 50), 0, 100);
}

/* 왼쪽 문장이 항상 그 문항의 극이므로, 1에 가까울수록 그 극으로 +점, 5에 가까우면 -점 */
function axisScore(answers, key, ctx) {
  const def = AXIS_BY_KEY[key];
  let sum = 0, n = 0;
  QUESTIONS.forEach((q, i) => {
    if (q.axis !== key) return;
    if (ctx && q.ctx !== ctx) return;
    const v = answers[i];
    if (v == null) return;
    const s = signed(v);
    sum += (q.pole === def.a ? s : -s);
    n++;
  });
  return { sum, n, aPct: pctFromSum(sum, n) };
}

function levelOf(diff) {
  if (diff <= 5) return '비슷함';
  if (diff <= 10) return '약한 우세';
  return '뚜렷한 우세';
}

function distOf(answers, key) {
  const c = { 5:0, 4:0, 3:0, 2:0, 1:0 };
  QUESTIONS.forEach((q, i) => {
    if (q.axis !== key) return;
    const v = answers[i];
    if (v != null && c[v] != null) c[v]++;
  });
  return c;
}

function borderKeys(answers) {
  return AXES.filter(def => {
    const s = axisScore(answers, def.key, null);
    return Math.abs(s.aPct - 50) <= BORDER_LIMIT;
  }).map(def => def.key);
}

function computeResult(answers, tieAnswers) {
  tieAnswers = tieAnswers || {};

  const axes = AXES.map(def => {
    const all = axisScore(answers, def.key, null);
    const work = axisScore(answers, def.key, 'work');
    const day = axisScore(answers, def.key, 'day');
    const aPct = all.aPct;
    const diff = Math.abs(aPct - 50);
    const isBorder = diff <= BORDER_LIMIT;
    const tiePole = (isBorder && tieAnswers[def.key]) ? tieAnswers[def.key] : null;

    let finalSum = all.sum;
    if (tiePole) finalSum += (tiePole === def.a ? 1 : -1) * TIE_WEIGHT;
    const finalAPct = tiePole ? pctFromSum(finalSum, all.n) : aPct;

    const surfaceLetter = aPct > 50 ? def.a : def.b;
    const letter = finalAPct > 50 ? def.a : def.b;
    const sidePct = letter === def.a ? finalAPct : 100 - finalAPct;
    const finalDiff = Math.abs(finalAPct - 50);
    const surfaceEven = aPct === 50;

    return {
      def, aPct, bPct: 100 - aPct, diff, level: levelOf(diff),
      isBorder, border: isBorder,
      workA: work.aPct, dayA: day.aPct,
      workLetter: work.aPct >= 50 ? def.a : def.b,
      dayLetter: day.aPct >= 50 ? def.a : def.b,
      surfaceLetter, letter, sidePct, finalDiff,
      finalAPct, aPctFinal: finalAPct,
      tiePole, surfaceEven,
      flipped: !!tiePole && !surfaceEven && letter !== surfaceLetter,
      dist: distOf(answers, def.key)
    };
  });

  const type = axes.map(x => x.letter).join('');
  const surfaceType = axes.map(x => x.surfaceLetter).join('');
  const typeInfo = TYPE_INFO[type] || { name:'', fn:['',''], line:'' };
  const surfaceInfo = TYPE_INFO[surfaceType] || { name:'', fn:['',''], line:'' };

  const pct = {};
  axes.forEach(x => { pct[x.def.a] = x.finalAPct; pct[x.def.b] = 100 - x.finalAPct; });

  // 인지기능: 문항 직접 응답 60% + 축 기울기 40%
  const FN_AXIS = { Ne:['N','E'], Ni:['N','I'], Se:['S','E'], Si:['S','I'], Te:['T','E'], Ti:['T','I'], Fe:['F','E'], Fi:['F','I'] };
  const fnRaw = {};
  const fnN = {};
  QUESTIONS.forEach((q, i) => {
    if (q.axis) return;
    const v = answers[i];
    if (v == null) return;
    fnRaw[q.pole] = (fnRaw[q.pole] || 0) + signed(v);
    fnN[q.pole] = (fnN[q.pole] || 0) + 1;
    fnRaw[q.other] = (fnRaw[q.other] || 0) - signed(v);
    fnN[q.other] = (fnN[q.other] || 0) + 1;
  });
  const idx = {};
  Object.keys(FN_NAME).forEach(code => {
    const n = fnN[code] || 1;
    const avg = (fnRaw[code] || 0) / n;            // -2 ~ +2
    const itemScore = ((avg + 2) / 4) * 100;
    const ax = FN_AXIS[code];
    const tilt = (pct[ax[0]] + pct[ax[1]]) / 2;
    idx[code] = Math.round(clamp(0.6 * itemScore + 0.4 * tilt, 0, 100));
  });
  const maxIdx = Math.max.apply(null, Object.keys(idx).map(k => idx[k])) || 1;
  const funcs = Object.keys(idx).map(code => ({
    code, name: FN_NAME[code], desc: FN_DESC[code], idx: idx[code], rel: Math.round((idx[code] / maxIdx) * 100)
  })).sort((x, y) => y.idx - x.idx);

  const top = funcs.slice(0, 3).map(f => f.code);
  const agree = top[0] === typeInfo.fn[0] ? '일치'
    : (top.slice(0, 2).indexOf(typeInfo.fn[0]) >= 0 ? '부분 일치' : '불일치');

  const neutralItems = [];
  const counterItems = [];
  QUESTIONS.forEach((q, i) => {
    const v = answers[i];
    if (v == null) return;
    if (v === 3) { neutralItems.push(i); return; }
    if (!q.axis) return;
    const ax = axes.filter(x => x.def.key === q.axis)[0];
    const towardDominant = (q.pole === ax.letter) ? signed(v) : -signed(v);
    if (towardDominant < 0) counterItems.push(i);
  });

  const borderAxes = axes.filter(x => x.isBorder);
  const flippedAxes = axes.filter(x => x.flipped);
  const confirmedAxes = axes.filter(x => x.isBorder && !x.flipped);
  const mixedCount = borderAxes.length;

  return {
    axes, type, surfaceType, typeInfo, surfaceInfo, funcs, top, agree,
    neutralItems, counterItems, borderAxes, flippedAxes, confirmedAxes,
    mixedCount, tieCount: borderAxes.length
  };
}

function ctxLabel(ctx) {
  if (ctx === 'work') return '일·공부할 때';
  if (ctx === 'day') return '평소·쉴 때';
  return '생각의 결';
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function knum(n) { return ['', '한', '두', '세', '네'][n] || String(n); }
function ro(x) { return x === 'N' ? '으로' : '로'; }
function koreanDateTime(d) {
  return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

/* 고른 답을 문장으로 되돌려 준다 (결과 글에 그대로 담는다) */
function answerText(q, v) {
  if (v == null) return '무응답';
  if (v === 3) return '3 · 반반 (둘 다 비슷함)';
  const side = v <= 2 ? q.l : q.r;
  return v + ' · ' + side + ' 쪽 (' + ((v === 1 || v === 5) ? '완전히' : '가까이') + ')';
}

/* 해석 문장 만들기 */
function buildInsight(r) {
  const paras = [];

  if (r.flippedAxes.length) {
    paras.push('40문항만으로는 ' + r.surfaceType + '로 나왔지만, 확인 문답에서 축 ' + knum(r.flippedAxes.length) + ' 개가 뒤집혀 최종 유형은 ' + r.type + '입니다. 점수가 비슷할 때 마지막 한 표를 어디에 두느냐가 실제 판단 방식을 가릅니다.');
  } else if (r.borderAxes.length) {
    const allEven = r.borderAxes.every(x => x.surfaceEven);
    paras.push(allEven
      ? '비슷하게 나온 축 ' + knum(r.borderAxes.length) + ' 개는 40문항에서 반반이었고, 확인 문답에서 정해졌습니다. 최종 유형은 ' + r.type + '입니다.'
      : '비슷하게 나온 축 ' + knum(r.borderAxes.length) + ' 개가 확인 문답에서도 40문항과 같은 쪽으로 확인되었습니다. 최종 유형은 ' + r.type + '입니다.');
  } else {
    paras.push('네 축 모두 10포인트 넘게 갈려 확인 문답 없이 유형이 정해졌습니다. 결과는 ' + r.type + '입니다.');
  }

  r.flippedAxes.forEach(x => {
    let s = x.def.name + ' 축은 확인 문답에서 ' + x.letter + ro(x.letter) + ' 확정되었습니다. 40문항 점수는 ' + x.surfaceLetter + ' 쪽으로 ' + x.diff + '포인트 기울어 있었지만, 마지막 문답이 방향을 바꿨습니다.';
    if (x.workLetter === x.letter && x.dayLetter !== x.letter) {
      s += ' 일·공부할 때의 방식(' + x.letter + ')이 판단의 중심이고, 평소의 ' + x.dayLetter + '는 편안할 때 드러나는 모습입니다.';
    } else if (x.dayLetter === x.letter && x.workLetter !== x.letter) {
      s += ' 평소의 방식(' + x.letter + ')이 중심이고, 일·공부할 때는 상황에 맞춰 ' + x.workLetter + ro(x.workLetter) + ' 움직입니다.';
    }
    paras.push(s);
  });

  r.confirmedAxes.forEach(x => {
    if (x.surfaceEven) {
      paras.push(x.def.name + ' 축은 40문항에서 정확히 반반이었고, 확인 문답에서 ' + x.letter + ro(x.letter) + ' 확정되었습니다. 숫자만으로는 알 수 없던 부분입니다.');
    } else {
      paras.push(x.def.name + ' 축은 40문항에서 ' + x.surfaceLetter + ' 쪽으로 ' + x.diff + '포인트 앞섰는데, 확인 문답에서도 ' + x.letter + ' 쪽으로 확인되었습니다. 이 축은 ' + x.letter + ' 성향이 맞습니다.');
    }
  });

  const swing = r.axes.filter(x => Math.abs(x.workA - x.dayA) >= 12);
  if (swing.length) {
    paras.push('일·공부할 때와 평소의 기울기가 크게 다른 축이 ' + knum(swing.length) + ' 개입니다(' + swing.map(x => x.def.name).join(', ') + '). 상황에 따라 다르게 쓰는 축이라, 한 장면만 보고 판단하면 유형을 잘못 잡기 쉽습니다.');
  }

  if (r.agree === '불일치') {
    paras.push('측정에서 가장 높게 나온 기능은 ' + r.top[0] + '(' + FN_NAME[r.top[0]] + ')인데, ' + r.type + '의 기준 주기능은 ' + r.typeInfo.fn[0] + '(' + FN_NAME[r.typeInfo.fn[0]] + ')입니다. 이럴 때는 두 유형을 함께 읽어 보는 편이 맞습니다.');
  }

  return paras;
}

function sideLabel(x, p) {
  if (p === 50) return x.def.a + ' 50 · ' + x.def.b + ' 50 (반반)';
  return (p > 50 ? x.def.a : x.def.b) + ' ' + Math.max(p, 100 - p) + '%';
}

function desiredLine(x) {
  const base = '40문항 ' + x.def.a + ' ' + x.aPct + '% / ' + x.def.b + ' ' + x.bPct + '%';
  if (!x.tiePole) return x.def.name + ': ' + base + ', ' + x.level;
  const tag = x.flipped ? '40문항과 뒤집힘' : (x.surfaceEven ? '반반에서 확정' : '40문항과 같음');
  return x.def.name + ': ' + base + ' → 확인 문답 반영 ' + x.letter + ' ' + x.sidePct + '%, ' + tag;
}

function buildReportText(answers, tieAnswers, r, when) {
  const L = [];
  L.push('[MBTI 성격유형 검사 결과]');
  L.push('유형: ' + r.type + ' (' + r.typeInfo.name + ')');
  if (r.surfaceType !== r.type) L.push('40문항 기준 유형: ' + r.surfaceType + ' (' + r.surfaceInfo.name + ')');
  L.push('검사 일시: ' + koreanDateTime(when));
  L.push('구성: 40문항' + (r.tieCount ? ' + 확인 문답 ' + knum(r.tieCount) + ' 문항' : '') + '. 문항마다 장면을 읽고 두 반응 중 더 자연스러운 쪽을 5단계로 골랐습니다 (1 왼쪽 반응에 완전히, 3 반반, 5 오른쪽 반응에 완전히).');
  L.push('');

  L.push('■ 핵심 해석');
  buildInsight(r).forEach(p => L.push(p));
  L.push('');

  L.push('■ 축별 점수 (확인 문답 반영)');
  r.axes.forEach(x => L.push(desiredLine(x)));
  L.push('');

  if (r.tieCount) {
    L.push('■ 확인 문답 (비슷한 축 확정)');
    let k = 0;
    r.borderAxes.forEach(x => {
      k++;
      const t = TIE[x.def.key];
      const pick = x.tiePole === x.def.a ? t.a : t.b;
      L.push('문답 ' + k + '. [' + x.def.name + '] ' + t.s);
      L.push('   물음: ' + t.q);
      L.push('   고른 답: ' + pick);
      L.push('   결과: ' + x.letter + ' 확정, ' + (x.flipped ? '40문항 ' + x.surfaceLetter + '에서 뒤집힘' : (x.surfaceEven ? '40문항에서 반반이던 축' : '40문항과 같음')));
    });
    L.push('');
  }

  L.push('■ 일할 때와 평소의 차이');
  r.axes.forEach(x => {
    const gap = Math.abs(x.workA - x.dayA);
    let tail;
    if (gap === 0) tail = '차이 없음';
    else if (gap >= 12) tail = '차이 ' + gap + '포인트 (뚜렷한 차이)';
    else tail = '차이 ' + gap + '포인트';
    L.push(x.def.name + ': 일·공부할 때 ' + sideLabel(x, x.workA) + ' / 평소·쉴 때 ' + sideLabel(x, x.dayA) + ' → ' + tail);
  });
  L.push('');

  L.push('■ 축별 응답 분포 (고른 단계별 개수)');
  r.axes.forEach(x => {
    const d = x.dist;
    L.push(x.def.name + ': 1이 ' + d[1] + '개, 2가 ' + d[2] + '개, 3이 ' + d[3] + '개, 4가 ' + d[4] + '개, 5가 ' + d[5] + '개');
  });
  L.push('');

  L.push('■ 인지기능 8종 상대 지수 (가장 높은 기능을 100으로 둔 상대값)');
  r.funcs.forEach((f, i) => {
    L.push((i + 1) + '. ' + f.code + ' ' + f.name + ' ' + f.rel + ' (' + f.desc + ')');
  });
  L.push('');

  L.push('■ 추정 주기능과 부기능');
  L.push('유형 기준: 주기능 ' + r.typeInfo.fn[0] + ' ' + FN_NAME[r.typeInfo.fn[0]] + ', 부기능 ' + r.typeInfo.fn[1] + ' ' + FN_NAME[r.typeInfo.fn[1]]);
  L.push('측정 상위: ' + r.top.map(c => c + ' ' + FN_NAME[c]).join(', ') + ' → 유형 기준과 ' + r.agree);
  L.push('');

  L.push('■ 비슷하게 나온 축과 응답 습관');
  if (r.borderAxes.length === 0) {
    L.push('비슷하게 나온 축: 없음 (네 축 모두 10포인트 넘게 갈림)');
  } else {
    L.push('비슷하게 나온 축: ' + r.borderAxes.map(x => x.def.name + ' (' + x.def.a + ' ' + x.aPct + ' / ' + x.def.b + ' ' + x.bPct + ', ' + (x.diff === 0 ? '반반' : x.diff + '포인트 차') + ')').join(', '));
  }
  L.push('보통으로 답한 문항: ' + (r.neutralItems.length ? r.neutralItems.map(i => i + 1).join(', ') : '없음'));
  L.push('우세와 반대 방향 응답: ' + (r.counterItems.length ? r.counterItems.map(i => i + 1).join(', ') : '없음'));
  L.push('');

  L.push('■ 문항별 응답');
  QUESTIONS.forEach((q, i) => {
    const where = q.axis ? AXIS_BY_KEY[q.axis].name + ' / ' + ctxLabel(q.ctx) : '생각의 결';
    L.push((i + 1) + '. [' + where + '] ' + q.s);
    L.push('   왼쪽: ' + q.l + ' / 오른쪽: ' + q.r);
    L.push('   답: ' + answerText(q, answers[i]));
  });
  L.push('');
  L.push('자기보고식 검사이며 의학적 진단이 아닙니다. 축 점수가 50에 가까울수록 장면에 따라 양쪽이 다 나타난다는 뜻입니다.');

  return L.join('\n');
}
/* LOGIC END */

  function gaugeHTML(a) {
    const leftPct = a.finalAPct;
    const rightPct = 100 - leftPct;
    const leftIsDom = a.letter === a.def.a;
    const note = a.letter + ' ' + a.sidePct + '% · ' + a.finalDiff + '포인트 차' +
      (a.tiePole ? ' · <span class="edge">확인 문답 반영</span>' : ' · ' + a.level);
    const sub = a.tiePole
      ? '40문항 ' + a.def.a + ' ' + a.aPct + '% / ' + a.def.b + ' ' + a.bPct + '%' +
        (a.flipped ? ' → 최종 ' + a.letter + ro(a.letter) + ' 뒤집힘' : (a.surfaceEven ? ' → 반반에서 ' + a.letter + ro(a.letter) + ' 확정' : ' → 그대로 유지'))
      : '';
    return '' +
      '<div class="g">' +
        '<div class="gHead">' +
          '<span class="side">' + (leftIsDom ? '<b>' + a.def.a + ' ' + leftPct + '%</b>' : a.def.a + ' ' + leftPct + '%') + '</span>' +
          '<span class="nm">' + a.def.name + '</span>' +
          '<span class="side">' + (leftIsDom ? a.def.b + ' ' + rightPct + '%' : '<b>' + a.def.b + ' ' + rightPct + '%</b>') + '</span>' +
        '</div>' +
        '<div class="track"><span class="fillA" style="width:' + leftPct + '%"></span><span class="mark" style="left:' + a.aPct + '%"></span></div>' +
        '<div class="gNote">' + note + '</div>' +
        (sub ? '<div class="gSub">' + sub + '</div>' : '') +
      '</div>';
  }

  function wdHTML(a) {
    const wB = 100 - a.workA, dB = 100 - a.dayA;
    const clip = n => Math.max(0, Math.min(100, n));
    const gap = Math.abs(a.workA - a.dayA);
    const note = gap === 0 ? '두 장면 차이 없음'
      : ('차이 <b>' + gap + '포인트</b>' + (gap >= 12 ? ' · 뚜렷한 차이' : ''));
    return '' +
      '<div class="wdAxis">' + a.def.name + ' <span style="font-weight:400;color:#8a8478;font-size:12px">' + a.def.a + ' ' + a.def.aName + ' / ' + a.def.b + ' ' + a.def.bName + '</span></div>' +
      '<div class="wdRow">' +
        '<span class="wdLab">일·공부</span>' +
        '<span class="wdNums">' + (a.workA >= 50 ? '<b>' + a.def.a + ' ' + a.workA + '%</b> · ' + a.def.b + ' ' + wB + '%' : a.def.a + ' ' + a.workA + '% · <b>' + a.def.b + ' ' + wB + '%</b>') + '</span>' +
        '<span class="mini"><i class="a" style="width:' + clip(a.workA) + '%"></i><i class="b" style="width:' + clip(wB) + '%"></i></span>' +
      '</div>' +
      '<div class="wdRow">' +
        '<span class="wdLab">평소·쉴 때</span>' +
        '<span class="wdNums">' + (a.dayA >= 50 ? '<b>' + a.def.a + ' ' + a.dayA + '%</b> · ' + a.def.b + ' ' + dB + '%' : a.def.a + ' ' + a.dayA + '% · <b>' + a.def.b + ' ' + dB + '%</b>') + '</span>' +
        '<span class="mini"><i class="a" style="width:' + clip(a.dayA) + '%"></i><i class="b" style="width:' + clip(dB) + '%"></i></span>' +
      '</div>' +
      '<div class="wdNote">' + note + '</div>';
  }

  function tieCardHTML(x) {
    const def = AXIS_BY_KEY[x.def.key];
    const t = TIE[def.key];
    const pick = x.tiePole === def.a ? t.a : t.b;
    const stateCls = x.flipped ? 'flip' : (x.surfaceEven ? 'settle' : 'keep');
    const stateText = x.flipped
      ? '40문항 ' + x.surfaceLetter + '에서 최종 ' + x.letter + ro(x.letter) + ' 뒤집힘'
      : (x.surfaceEven ? '반반에서 ' + x.letter + ro(x.letter) + ' 확정' : '40문항과 같은 ' + x.letter + ro(x.letter) + ' 확인');
    return '' +
      '<div class="tieCard">' +
        '<div class="axisLab">' + def.name + ' · ' + x.def.a + ' ' + x.aPct + ' / ' + x.def.b + ' ' + x.bPct + '</div>' +
        '<div class="axisQ">' + t.q + '</div>' +
        '<div class="axisA">고른 답: ' + pick + '</div>' +
        '<div class="axisR ' + stateCls + '">' + stateText + '</div>' +
      '</div>';
  }

  function resultHTML() {
    const r = lastResult;
    const insight = buildInsight(r);
    const axesHTML = r.axes.map(gaugeHTML).join('');
    const wdHTMLAll = r.axes.map(wdHTML).join('');
    const fnHTML = r.funcs.map((f, i) => {
      const top = i < 3 ? ' top' : '';
      return '<div class="fnRow' + top + '">' +
        '<div class="fnTop"><span class="fnCode">' + f.code + '</span><span class="fnName">' + f.name + '</span><span class="fnVal">' + f.rel + '</span></div>' +
        '<div class="fnDesc">' + f.desc + '</div>' +
        '<div class="fnBar"><i style="width:' + f.rel + '%"></i></div>' +
      '</div>';
    }).join('');

    const cmpHTML = r.borderAxes.length
      ? '<div class="cmpCard">' +
          '<div class="cmpRow"><span class="k">40문항 결과</span><span class="v">' + r.surfaceType + '</span><span class="cmpArrow">→ 확인 문답 반영</span><span class="v core">' + r.type + '</span></div>' +
          '<div class="c2Note">' + (r.flippedAxes.length
            ? '확인 문답에서 뒤집힌 축: ' + r.flippedAxes.map(x => x.def.name).join(', ')
            : '비슷하게 나온 축이 모두 확인 문답으로 정해졌습니다.') + '</div>' +
        '</div>'
      : '';

    const baseFn = r.typeInfo.fn[0] + ' ' + FN_NAME[r.typeInfo.fn[0]];
    const auxFn = r.typeInfo.fn[1] + ' ' + FN_NAME[r.typeInfo.fn[1]];
    const measured = r.top.map(c => c + ' ' + FN_NAME[c]).join(', ');
    const agreeNote = r.agree === '일치'
      ? '측정 상위 기능이 유형 기준 주기능과 일치합니다. 응답이 안정적이라는 신호입니다.'
      : (r.agree === '부분 일치'
        ? '측정 상위 기능에 유형 기준 주기능이 들어 있습니다. 부기능 쪽에서 흔들린 응답이 있다는 뜻입니다.'
        : '측정한 상위 기능이 유형 기준 주기능과 다릅니다. 축이 비슷하게 나온 경우에 흔한 결과이고, 두 후보 유형을 함께 읽어 보라는 신호입니다.');

    const mixedLine = r.mixedCount === 0
      ? '네 축 모두 10포인트 넘게 갈려 확인 문답 없이 유형이 정해졌습니다.'
      : (r.mixedCount >= 3
        ? '네 축 가운데 ' + knum(r.mixedCount) + ' 개가 비슷하게 나왔습니다. 한 유형으로 단정하기보다 장면에 따라 달라지는 폭을 함께 보는 편이 좋습니다.'
        : '비슷하게 나온 축이 ' + knum(r.mixedCount) + ' 개입니다. 뚜렷한 축은 그대로 두고, 비슷한 축만 확인 문답으로 정했습니다.');

    const badgeRow = r.borderAxes.length
      ? r.borderAxes.map(x => '<span class="badge ' + (x.flipped ? 'flip' : (x.surfaceEven ? 'settle' : 'keep')) + '">' + x.def.name + ' ' + (x.flipped ? '뒤집힘 ' : (x.surfaceEven ? '확정 ' : '확인 ')) + x.letter + '</span>').join('')
      : '<span class="badge none">추가 확인 없음</span>';

    return '' +
      '<div class="resTop">' +
        '<div class="resKicker">' + (r.borderAxes.length ? '확인 문답 반영 유형' : '검사 결과') + '</div>' +
        '<div class="typeCode">' + r.type + '</div>' +
        '<div class="typeName">' + r.typeInfo.name + '</div>' +
        '<p class="typeLine">' + r.typeInfo.line + '</p>' +
      '</div>' +

      (cmpHTML ? '<div class="sec" style="margin-top:14px">' + cmpHTML + '</div>' : '') +

      '<div class="sec">' +
        '<div class="secT"><h3>핵심 해석</h3><span>' + (r.borderAxes.length ? '확인 문답 반영' : '축 확정') + '</span></div>' +
        '<div class="c2">' + insight.map(p => '<div class="c2Note insightP" style="margin-top:0;color:var(--body);font-size:13.8px">' + p + '</div>').join('') + '</div>' +
      '</div>' +

      '<div class="sec">' +
        '<div class="secT"><h3>축별 스펙트럼</h3><span>E·S·T·J가 왼쪽</span></div>' +
        '<div class="card" style="padding-top:6px;padding-bottom:8px">' + axesHTML + '</div>' +
        '<p class="legend">가는 세로선이 40문항 점수, 막대가 확인 문답까지 반영한 최종 점수입니다.</p>' +
        '<p class="typeLine" style="margin:8px 4px 0;font-size:13.4px">' + mixedLine + '</p>' +
      '</div>' +

      (r.borderAxes.length
        ? '<div class="sec">' +
            '<div class="secT"><h3>확인 문답</h3><span>비슷하게 나온 축 ' + r.borderAxes.length + '문항</span></div>' +
            '<div class="card" style="padding:6px 16px 10px"><div class="tieList2">' + r.borderAxes.map(tieCardHTML).join('') + '</div></div>' +
            '<div class="badgeRow" style="margin-top:10px">' + badgeRow + '</div>' +
          '</div>'
        : '') +

      '<div class="sec">' +
        '<div class="secT"><h3>일할 때와 평소의 차이</h3><span>축마다 두 장면 비교</span></div>' +
        '<div class="card" style="padding:10px 16px 14px">' + wdHTMLAll + '</div>' +
      '</div>' +

      '<div class="sec">' +
        '<div class="secT"><h3>인지기능 성향</h3><span>가장 높은 기능 = 100</span></div>' +
        '<div class="card" style="padding:8px 16px 12px">' + fnHTML + '</div>' +
      '</div>' +

      '<div class="sec">' +
        '<div class="secT"><h3>추정 주기능과 부기능</h3><span>' + r.agree + '</span></div>' +
        '<div class="c2">' +
          '<div class="c2Lab">유형 기준</div>' +
          '<div class="c2Main">주기능 <em>' + baseFn + '</em> · 부기능 <em>' + auxFn + '</em></div>' +
          '<div class="c2Note">측정 상위 기능: ' + measured + '. ' + agreeNote + '</div>' +
        '</div>' +
      '</div>' +

      '<div class="sec">' +
        '<div class="secT"><h3>비슷하게 나온 축과 응답 습관</h3><span>50에서 10포인트 안쪽</span></div>' +
        '<div class="chips">' + (r.borderAxes.length
          ? r.borderAxes.map(x => '<span class="chip2">' + x.def.name + ' ' + x.def.a + ' ' + x.aPct + ' · ' + x.def.b + ' ' + x.bPct + '</span>').join('')
          : '<span class="chip3">없음</span>') + '</div>' +
        '<p class="typeLine" style="margin:10px 2px 0;font-size:13.2px">보통으로 답한 문항 ' + r.neutralItems.length + '개, 우세와 반대 방향 응답 ' + r.counterItems.length + '개. 두 목록의 문항 번호는 결과 글에 함께 담겨 나옵니다.</p>' +
      '</div>' +

      '<div class="sec">' +
        '<div class="btnRow" style="margin-top:4px">' +
          '<button class="btn" data-act="copy">결과 복사</button>' +
          '<button class="btn ghost small" data-act="showtext">결과 텍스트 보기</button>' +
          '<button class="btn ghost small" data-act="restart">처음부터 다시 하기</button>' +
        '</div>' +
        '<p class="hint">복사한 뒤 메신저에 그대로 붙여넣으면 됩니다. 붙여넣기가 막히면 결과 텍스트를 길게 눌러 전체 선택해 주세요.</p>' +
        '<textarea class="report" id="reportArea" readonly spellcheck="false"></textarea>' +
      '</div>' +

      '<div class="sec">' +
        '<div class="c2" style="background:#faf7f0">' +
          '<div class="c2Lab">읽는 법</div>' +
          '<div class="c2Note" style="margin-top:0">축 퍼센트가 50에 가까울수록 장면에 따라 양쪽이 다 나타난다는 뜻이고, 그 자체도 쓸모 있는 정보입니다. 일할 때와 평소의 차이가 큰 축은 역할에 따라 다르게 쓰는 축입니다. 확인 문답은 둘 중 하나를 고르는 문항이라 무게를 세 문항분으로 두었습니다. 이 검사는 자기보고식이며 의학적 진단이 아닙니다.</div>' +
        '</div>' +
      '</div>';
  }

  function render() {
    clearTimeout(advanceTimer);
    if (state.view === 'intro') {
      view.innerHTML = introHTML();
    } else if (state.view === 'quiz') {
      view.innerHTML = quizHTML();
    } else if (state.view === 'tieIntro') {
      view.innerHTML = tieIntroHTML();
    } else if (state.view === 'tie') {
      view.innerHTML = tieHTML();
    } else {
      view.innerHTML = resultHTML();
    }
    foot.style.display = '';
    updateTopbar();
    scrollTop();
  }

  function startQuiz(atIdx) {
    const first = firstUnanswered();
    state.view = 'quiz';
    state.idx = (typeof atIdx === 'number') ? atIdx : (first < 0 ? 0 : first);
    save();
    render();
  }

  /* 저장본을 이어서 할 때 어느 문항부터 볼지 — 저장된 위치가 아직 답하지 않은 문항이면 그곳, 아니면 첫 미답 문항 */
  function resumeIndex(d) {
    const arr = (d && Array.isArray(d.answers)) ? d.answers : state.answers;
    const at = (d && typeof d.idx === 'number') ? d.idx : -1;
    if (at >= 0 && at < QUESTIONS.length && arr[at] == null) return at;
    for (let i = 0; i < arr.length; i++) if (arr[i] == null) return i;
    return -1;
  }

  /* 새 검사 — 이 기기에 저장된 답안을 지우고 1번 문항부터 시작한다 */
  function startFresh() {
    state.answers = new Array(QUESTIONS.length).fill(null);
    state.tieAnswers = {};
    state.tieList = [];
    state.tieIdx = 0;
    state.idx = 0;
    lastResult = null;
    clearSaved();
    startQuiz(0);
  }

  /* 인트로의 '이어서 하기' — 하던 곳(미완료 답안 또는 남은 확인 문답)부터 */
  function resumeSaved() {
    if (answeredCount() >= QUESTIONS.length) {
      state.tieList = borderKeys(state.answers);
      const left = firstUnansweredTie();
      if (left >= 0) {
        state.tieIdx = left;
        state.view = 'tie';
        save();
        render();
        return;
      }
      showResult();
      return;
    }
    const saved = load();
    const at = saved ? resumeIndex(saved) : -1;
    startQuiz(at < 0 ? undefined : at);
  }

  /* 인트로의 '지난 검사 결과 보기' — 저장된 답안으로 그때 결과를 다시 그린다 */
  function viewLastResult() {
    const saved = load();
    if (!saved) { toast('저장된 결과가 없습니다.'); state.view = 'intro'; render(); return; }
    state.answers = saved.answers.map(v => (typeof v === 'number' ? v : null));
    state.tieAnswers = (saved.tieAnswers && typeof saved.tieAnswers === 'object') ? saved.tieAnswers : {};
    state.tieList = borderKeys(state.answers);
    state.tieList.forEach(k => { if (state.tieAnswers[k] == null) delete state.tieAnswers[k]; });
    showResult();
  }

  function finishMain() {
    const missing = firstUnanswered();
    if (missing >= 0) {
      state.idx = missing;
      toast('아직 답하지 않은 문항이 있습니다.');
      render();
      return;
    }
    state.tieList = borderKeys(state.answers);
    const keep = {};
    state.tieList.forEach(k => { if (state.tieAnswers[k]) keep[k] = state.tieAnswers[k]; });
    state.tieAnswers = keep;
    if (state.tieList.length === 0) { showResult(); return; }
    const firstTie = firstUnansweredTie();
    if (firstTie < 0) { showResult(); return; }
    state.tieIdx = firstTie;
    state.view = 'tieIntro';
    save();
    render();
  }

  function startTie() {
    const i = firstUnansweredTie();
    state.tieIdx = i < 0 ? 0 : i;
    state.view = 'tie';
    save();
    render();
  }

  function showResult() {
    lastResult = computeResult(state.answers, state.tieAnswers);
    state.view = 'result';
    save();
    render();
  }

  function chooseTie(pole) {
    const key = state.tieList[state.tieIdx];
    state.tieAnswers[key] = pole;
    save();
    view.querySelectorAll('.tieOpt').forEach(b => b.setAttribute('aria-pressed', b.getAttribute('data-tie') === pole ? 'true' : 'false'));
    updateTopbar();
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(() => {
      if (state.tieList[state.tieIdx] !== key) return;
      advanceTie();
    }, 220);
  }

  function advanceTie() {
    const nextMissing = firstUnansweredTie();
    if (nextMissing < 0) { showResult(); return; }
    state.tieIdx = nextMissing;
    save();
    render();
  }

  /* 답을 고르면 잠깐 강조한 뒤 다음 문항으로 넘어간다 */
  function selectAnswer(v, delay) {
    const i = state.idx;
    state.answers[i] = v;
    save();
    view.querySelectorAll('[data-v]').forEach(b => {
      b.setAttribute('aria-pressed', Number(b.getAttribute('data-v')) === v ? 'true' : 'false');
    });
    const nextBtn = view.querySelector('[data-act="next"]');
    if (nextBtn) nextBtn.disabled = false;
    updateTopbar();
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(() => {
      if (i !== state.idx) return;
      if (i >= QUESTIONS.length - 1) { finishMain(); }
      else { state.idx = i + 1; render(); }
    }, delay);
  }

  function prev() {
    if (state.view === 'tie') {
      if (state.tieIdx > 0) {
        state.tieIdx--;
        save();
        render();
        return;
      }
      state.view = 'quiz';
      state.idx = QUESTIONS.length - 1;
      save();
      render();
      return;
    }
    if (state.idx === 0) return;
    state.idx = Math.max(0, state.idx - 1);
    save();
    render();
  }

  function next() {
    if (state.answers[state.idx] == null) {
      toast('먼저 답을 골라 주세요.');
      return;
    }
    if (state.idx >= QUESTIONS.length - 1) finishMain();
    else { state.idx++; save(); render(); }
  }

  function reportText() {
    if (!lastResult) lastResult = computeResult(state.answers, state.tieAnswers);
    return buildReportText(state.answers, state.tieAnswers, lastResult, new Date());
  }

  function showReportArea(text) {
    const area = document.getElementById('reportArea');
    if (!area) return null;
    area.value = text;
    area.classList.add('on');
    return area;
  }

  async function copyReport() {
    const text = reportText();
    let ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        ok = true;
      }
    } catch (e) { ok = false; }

    if (!ok) {
      try {
        const area = showReportArea(text);
        if (area) {
          area.focus();
          area.select();
          area.setSelectionRange(0, text.length);
          ok = document.execCommand('copy');
        }
      } catch (e) { ok = false; }
    }

    if (ok) {
      toast('복사했습니다. 붙여넣어 주세요.');
    } else {
      const area = showReportArea(text);
      if (area) {
        area.focus();
        area.select();
        area.setSelectionRange(0, text.length);
      }
      toast('복사가 막혔습니다. 아래 글을 길게 눌러 전체 선택해 주세요.');
    }
  }

  function restart() {
    state.answers = new Array(QUESTIONS.length).fill(null);
    state.tieAnswers = {};
    state.tieList = [];
    state.tieIdx = 0;
    state.idx = 0;
    state.view = 'intro';
    lastResult = null;
    clearSaved();
    render();
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (t) {
      const act = t.getAttribute('data-act');
      if (act === 'start') startFresh();
      else if (act === 'fresh') startFresh();
      else if (act === 'resume') resumeSaved();
      else if (act === 'viewlast') viewLastResult();
      else if (act === 'tab') setIntroTab(t.getAttribute('data-tab'));
      else if (act === 'prev') prev();
      else if (act === 'next') next();
      else if (act === 'tieStart') startTie();
      else if (act === 'copy') copyReport();
      else if (act === 'showtext') {
        const area = showReportArea(reportText());
        if (area) toast('아래 글을 길게 눌러 전체 선택할 수 있습니다.');
      }
      else if (act === 'restart') restart();
      return;
    }
    const tieBtn = e.target.closest('.tieOpt');
    if (tieBtn) { chooseTie(tieBtn.getAttribute('data-tie')); return; }
    const vBtn = e.target.closest('[data-v]');
    if (vBtn && state.view === 'quiz') {
      const v = Number(vBtn.getAttribute('data-v'));
      selectAnswer(v, vBtn.classList.contains('pole') ? 260 : 200);
    }
  });

  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (state.view === 'tie') {
      if (k === '1') { e.preventDefault(); chooseTie(AXIS_BY_KEY[state.tieList[state.tieIdx]].a); return; }
      if (k === '2') { e.preventDefault(); chooseTie(AXIS_BY_KEY[state.tieList[state.tieIdx]].b); return; }
      if (k === 'ArrowLeft') { e.preventDefault(); prev(); }
      return;
    }
    if (state.view !== 'quiz') return;
    if (k >= '1' && k <= '5') {
      e.preventDefault();
      selectAnswer(Number(k), 170);
      return;
    }
    if (k === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (k === 'ArrowRight' || k === 'Enter') {
      e.preventDefault();
      next();
    }
  });

  // init — 링크를 열면 항상 인트로(첫 화면)에서 시작한다.
  // 저장된 답안은 읽어만 두고, 이어 하거나 지난 결과를 볼 때만 쓴다.
  const saved = load();
  if (saved) {
    state.answers = saved.answers.map(v => (typeof v === 'number' ? v : null));
    if (saved.tieAnswers && typeof saved.tieAnswers === 'object') state.tieAnswers = saved.tieAnswers;
  }
  render();
})();
</script>
</body>
</html>
