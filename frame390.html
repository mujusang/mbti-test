<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>390 미리보기</title>
<style>
  html,body{margin:0;background:#dfe2e6;font-family:-apple-system,sans-serif;overflow:hidden;}
  .stage{padding:20px;display:flex;justify-content:center;}
  .frame{width:390px;height:844px;border-radius:26px;overflow:hidden;background:#f4f2ec;
    box-shadow:0 18px 44px -18px rgba(20,30,40,.55);border:1px solid #c9ced4;}
  iframe{width:390px;height:844px;border:0;display:block;}
</style>
</head>
<body>
<div class="stage">
  <div class="frame">
    <iframe id="pv" title="MBTI 성격유형 검사 390px 미리보기"></iframe>
  </div>
</div>
<script>
  var p = new URLSearchParams(location.search).get('p');
  document.getElementById('pv').src = (p === 'result' || p === 'tie') ? (p + '.html') : 'index.html';
</script>
</body>
</html>
